<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWE3003 Practice</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #e1e4ea;
    --accent: #2563eb; --accent-text: #ffffff; --soft: #eef2f7;
    --ok: #15803d; --ok-bg: #ecfdf3; --ok-border: #b7e4c7;
    --bad: #b91c1c; --bad-bg: #fdf0f0; --bad-border: #f3c4c4;
    --hint-bg: #fdf6e3; --hint-border: #f0dca8; --hint-text: #8a5a00;
    --code-bg: #f1f3f6; --editor-bg: #fbfcfd; --null: #9aa1ad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1a1e26; --text: #e6e8ec; --muted: #9aa1ad; --border: #2c323d;
      --accent: #3b82f6; --accent-text: #ffffff; --soft: #232934;
      --ok: #4ade80; --ok-bg: #12261a; --ok-border: #1f4d2e;
      --bad: #f87171; --bad-bg: #2a1616; --bad-border: #5a2626;
      --hint-bg: #2a2416; --hint-border: #57461f; --hint-text: #f2c96b;
      --code-bg: #232934; --editor-bg: #151920; --null: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  code, pre, textarea, .mono { font-family: Consolas, "Cascadia Mono", ui-monospace, monospace; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }

  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--border);
           padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  .progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
  .progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
  .bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; padding: 20px;
            max-width: 1400px; margin: 0 auto; }
  nav { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px;
        align-self: start; position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
  .set { margin-bottom: 8px; }
  .set-head { display: flex; justify-content: space-between; gap: 6px; font-weight: 600; font-size: 13px;
              padding: 6px 6px; cursor: pointer; border-radius: 6px; }
  .set-head:hover { background: var(--soft); }
  .set-head .count { color: var(--muted); font-weight: 400; white-space: nowrap; }
  .qlist { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 6px 8px; }
  .set.collapsed .qlist { display: none; }
  .qbtn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 6px;
          padding: 3px 7px; font-size: 12.5px; cursor: pointer; min-width: 42px; }
  .qbtn:hover { border-color: var(--accent); }
  .qbtn.passed { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .qbtn.tried { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
  .qbtn.current { outline: 2px solid var(--accent); outline-offset: 1px; }

  main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; }
  .qtop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .qtitle { font-size: 18px; font-weight: 700; margin: 0; }
  .qsub { color: var(--muted); font-size: 13px; }
  .qtext { margin: 10px 0 14px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--soft);
         color: var(--muted); margin-left: 6px; }
  .hint { background: var(--hint-bg); border: 1px solid var(--hint-border); color: var(--hint-text);
          border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .note { background: var(--soft); border-radius: 8px; padding: 8px 12px; margin: 10px 0; font-size: 13.5px; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px;
         padding: 7px 14px; font-weight: 600; font-size: 14px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.small { padding: 4px 10px; font-size: 13px; font-weight: 600; }
  .btn:disabled { opacity: .55; cursor: default; }
  textarea { width: 100%; min-height: 150px; resize: vertical; border: 1.5px solid var(--border); border-radius: 10px;
             padding: 12px 14px; font-size: 14.5px; line-height: 1.5; background: var(--editor-bg); color: var(--text);
             tab-size: 2; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .actions .left { flex: 1; color: var(--muted); font-size: 13px; }
  .kbd { color: var(--muted); font-size: 12px; }

  .result { margin-top: 16px; }
  .banner { border-radius: 10px; padding: 12px 16px; border: 1px solid; margin-bottom: 12px; }
  .banner.ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
  .banner.bad { background: var(--bad-bg); border-color: var(--bad-border); color: var(--bad); }
  .banner.info { background: var(--soft); border-color: var(--border); color: var(--text); }
  .banner .msg { white-space: pre-wrap; }
  .banner .big { font-weight: 700; font-size: 15.5px; }
  .outputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .outputs h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .tablebox { border: 1px solid var(--border); border-radius: 8px; overflow: auto; max-height: 340px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--soft); position: sticky; top: 0; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.null { color: var(--null); font-style: italic; }
  .rowcount { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  pre.out { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; overflow: auto; max-height: 320px;
            margin: 0; font-size: 13px; white-space: pre; }
  .error { color: var(--bad); white-space: pre-wrap; font-family: Consolas, ui-monospace, monospace; font-size: 13px;
           background: var(--bad-bg); border: 1px solid var(--bad-border); border-radius: 8px; padding: 10px 12px; }

  .solution { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .solution pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow: auto; }
  .solution pre code { background: none; padding: 0; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .tab { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 99px;
         padding: 3px 12px; font-size: 13px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .tables-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tables-head h3 { margin: 0; font-size: 15px; }
  .schema { color: var(--muted); font-size: 13px; }

  .foot { max-width: 1400px; margin: 0 auto; padding: 4px 20px 24px; color: var(--muted); font-size: 12.5px; text-align: center; }
  #alerts:empty { display: none; }
  .banner .dismiss { float: right; margin-left: 12px; }
  .banner pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 12.5px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; padding: 12px; }
    nav { position: static; max-height: none; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <h1>SWE3003 Practice</h1>
  <div class="progress-wrap">
    <div class="progress-label"><span id="qpos">Loading…</span><span id="pct"></span></div>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <button class="btn small" id="resetBtn" title="Delete your progress and start from a fresh database">Reset progress</button>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div id="alerts"></div>
    <section class="card" id="card">
      <div class="qtop">
        <h2 class="qtitle" id="qtitle">Loading…</h2>
        <span class="qsub" id="qsub"></span>
      </div>
      <div class="qtext" id="qtext"></div>
      <div id="checknote"></div>
      <div id="hintbox"></div>
      <div class="actions" style="margin: 0 0 10px">
        <button class="btn small" id="hintBtn">Show a hint</button>
        <button class="btn small" id="solBtn">Show solution</button>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Write your SELECT statement here..."></textarea>
      <div class="actions">
        <span class="left" id="attempts"></span>
        <span class="kbd">Ctrl+Enter = Run &amp; Submit</span>
        <button class="btn" id="runBtn" title="Just run it and show the output">Run</button>
        <button class="btn primary" id="submitBtn">Run &amp; Submit</button>
        <button class="btn" id="nextBtn">Next →</button>
      </div>
      <div class="result" id="result"></div>
      <div id="solution"></div>
    </section>

    <section class="card">
      <div class="tables-head">
        <h3>Tables <span class="schema" id="schemaName"></span></h3>
        <button class="btn small" id="refreshTables" title="Reload the table contents">Refresh</button>
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="tableView"></div>
    </section>
  </main>
</div>

<footer class="foot">Unofficial practice site for SWE3003 (Database Systems). Runs entirely in your browser with PGlite; your progress stays in this browser.</footer>

<noscript><div style="max-width:700px;margin:20px auto;padding:0 20px">This page needs JavaScript.</div></noscript>

<script>
/* Plain script (not a module) so it still runs when the page is opened as a file. */
if (!/^https?:$/.test(location.protocol)) {
  document.querySelector('.layout').innerHTML =
    '<main><section class="card"><h2 class="qtitle">Open this page through a web server</h2>' +
    '<div class="qtext">GitHub Pages works, or run <code>python3 -m http.server 8000</code> in this folder ' +
    'and open <code>http://localhost:8000</code></div></section></main>';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('qpos').textContent = 'Not connected';
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
